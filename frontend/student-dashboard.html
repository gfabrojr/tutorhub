<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Student Dashboard | TutorHub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Figtree:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/student.css" />
  </head>
  <body class="student" data-role="student">
    <nav id="nav"></nav>
    <main class="wrap">
      <section class="sd-hero">
        <div class="sd-intro">
          <h1 id="welcome"></h1>
          <p id="intro"></p>
          <a class="sd-cta" href="tutors.html">Book a tutor</a>
        </div>
        <div class="sd-slot" id="ticket"></div>
      </section>
      <div class="sd-facts" id="stats"></div>
      <section>
        <h2>Your week</h2>
        <div class="sd-week" id="week"></div>
        <p class="sd-note">Green dot: approved. Pink ring: waiting for approval.</p>
      </section>
      <section id="upSection" hidden>
        <h2>Coming up</h2>
        <div id="upBox"></div>
      </section>
      <section>
        <h2>Tutors you can book</h2>
        <div class="sd-tutors scroll" id="tutorsBox"></div>
      </section>
    </main>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/main.js"></script>
    <script src="js/student-dashboard.js"></script>
  </body>
</html>
